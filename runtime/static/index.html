<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Rescue Demo</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #e3e6ec;
    --accent: #2f5bd3; --accent-soft: #e8eefc;
    --ok: #18794e; --ok-soft: #e3f5ec; --warn: #b25e09; --warn-soft: #fdf0e1;
    --bad: #c4321f; --bad-soft: #fde8e5; --idle: #8a93a5; --idle-soft: #eef0f4;
    --ai: #8a5a00; --ai-soft: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b1f29; --ink: #e7eaf0; --muted: #98a2b3; --line: #2c3240;
      --accent: #7b9cff; --accent-soft: #232c45;
      --ok: #4cc38a; --ok-soft: #173126; --warn: #f0a050; --warn-soft: #3a2a17;
      --bad: #ff7a66; --bad-soft: #3d1f1b; --idle: #7d8699; --idle-soft: #252a35;
      --ai: #f2c55c; --ai-soft: #3a3017;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  .labels { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--idle-soft); color: var(--muted); white-space: nowrap; }
  .tag.mode { background: var(--ai-soft); color: var(--ai); font-weight: 600; }
  .layout { display: grid; grid-template-columns: 240px 1fr 340px; gap: 16px; padding: 16px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 8px 12px; text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .case-btn { width: 100%; margin-bottom: 8px; }
  .case-btn small { display: block; color: var(--muted); font-size: 12px; }
  .case-btn.active { border-color: var(--accent); background: var(--accent-soft); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .muted { color: var(--muted); }
  .case-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .case-head h3 { margin: 0; font-size: 18px; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  /* pipeline */
  .pipeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .step { border-radius: 8px; padding: 8px 6px; text-align: center; font-size: 12px; line-height: 1.3;
          background: var(--ok-soft); color: var(--ok); border: 1px solid transparent; position: relative; }
  .step b { display: block; font-size: 11px; opacity: .7; }
  .step.ai { background: var(--ai-soft); color: var(--ai); }
  .step.skipped { background: var(--idle-soft); color: var(--idle); text-decoration: line-through; }
  .step.gate-stop { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  /* decision card */
  .decision { border-left: 5px solid var(--idle); }
  .decision.ALLOWED { border-left-color: var(--ok); }
  .decision.ESCALATED { border-left-color: var(--warn); }
  .decision.BLOCKED { border-left-color: var(--bad); }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .badge.ALLOWED { background: var(--ok-soft); color: var(--ok); }
  .badge.ESCALATED { background: var(--warn-soft); color: var(--warn); }
  .badge.BLOCKED { background: var(--bad-soft); color: var(--bad); }
  .badge.CLOSED { background: var(--idle-soft); color: var(--idle); }
  .headline { font-size: 19px; font-weight: 650; margin: 8px 0 12px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .meter { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 8px; }
  .meter i { width: 26px; height: 8px; border-radius: 2px; background: var(--idle-soft); }
  .meter i.on { background: var(--accent); }
  .question { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
  .reasons { margin: 12px 0 0; padding-left: 18px; }
  .reasons li { margin-bottom: 4px; }
  .reasons li.blocked { color: var(--bad); font-weight: 600; }
  .issue { margin-top: 10px; font-size: 13px; padding: 6px 10px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
  /* evidence + history */
  .ev { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .ev.cited { border-color: var(--accent); background: var(--accent-soft); }
  .ev .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .ev .new { color: var(--accent); font-weight: 700; }
  .hist { width: 100%; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .hist.active { border-color: var(--accent); background: var(--accent-soft); }
  .hist .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 38px; }
  .hist .what { flex: 1; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--idle); }
  .dot.ALLOWED { background: var(--ok); } .dot.ESCALATED { background: var(--warn); } .dot.BLOCKED { background: var(--bad); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .pipeline { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 560px) { .layout { padding: 12px 16px; } .pipeline { grid-template-columns: repeat(2, 1fr); } .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Order Rescue · Demo</h1>
  <div class="labels">
    <span class="tag">Dữ liệu giả lập</span><span class="tag">Luật minh họa</span>
    <span class="tag">Kết quả mô phỏng</span><span class="tag mode" id="mode">REPLAY</span>
  </div>
</header>

<div class="layout">
  <aside class="panel">
    <h2>Chọn tình huống</h2>
    <div id="cases"></div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">4 case đầu có cùng trạng thái lỗi. Khác nhau ở bằng chứng.</p>
  </aside>

  <main class="stack" id="main"><div class="panel empty">Chọn một tình huống bên trái để bắt đầu.</div></main>

  <aside class="stack" id="side"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
const STEPS = {
  "load-case": "Kiểm tra case", "build-evidence": "Gom bằng chứng", "assess-case": "AI đánh giá",
  "validate-output": "Kiểm tra output AI", "policy-gate": "Kiểm tra luật",
  "compose-recommendation": "Soạn đề xuất", "audit-log": "Ghi nhật ký",
};
const CAUSES = {
  TEMPORARY_ABSENCE: "Người mua vắng mặt tạm thời", UNKNOWN_CONTACT_PROBLEM: "Chưa liên lạc được",
  UNCLEAR_LOCATION: "Địa chỉ / mốc chưa rõ", DISRUPTION: "Gián đoạn dịch vụ",
  UNVERIFIED_REFUSAL: "'Từ chối' chưa xác minh", UNKNOWN: "Chưa xác định",
};
const STATUS = { ALLOWED: "Được phép", ESCALATED: "Chuyển người xử lý", BLOCKED: "Bị chặn", CLOSED: "Đã đóng" };
const OWNER = { buyer_reply_pending: "Chờ người mua trả lời", system_reassess: "Hệ thống đánh giá lại",
                operations: "Đội vận hành", none: "Không" };
const FAIL = { RECIPIENT_UNAVAILABLE: "Không gặp người nhận", BUYER_REFUSED: "Người mua từ chối" };

let run = null, selected = null, activeCase = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = (iso) => iso ? new Date(iso).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Ho_Chi_Minh" }) : "";
const when = (iso) => iso ? new Date(iso).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", timeZone: "Asia/Ho_Chi_Minh" }) : "";

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) { toast("Lỗi: " + (await res.text())); throw new Error(res.status); }
  return res.json();
}

async function loadCases() {
  const cases = await api("/cases");
  $("cases").innerHTML = cases.map((c) => `
    <button class="case-btn ${c.case_id === activeCase ? "active" : ""}" data-case="${c.case_id}">
      ${esc(c.title)}<small>${c.case_id} · ${esc(FAIL[c.failure_status] || c.failure_status)}</small>
    </button>`).join("");
  document.querySelectorAll("[data-case]").forEach((b) => b.onclick = () => startCase(b.dataset.case));
}

async function startCase(caseId) {
  activeCase = caseId;
  setRun(await api("/runs", { case_id: caseId }));
  loadCases();
}

function setRun(next) { run = next; selected = run.history.length - 1; render(); }

async function applyEvent(eventId) {
  const before = run.history.length;
  setRun(await api(`/runs/${run.run_id}/events`, { event_id: eventId }));
  if (run.history.length === before) toast("Sự kiện đã áp dụng trước đó");
}

async function advance(minutes) {
  const before = run.history.length;
  setRun(await api(`/runs/${run.run_id}/advance`, { minutes }));
  if (run.history.length === before) toast(`Đã tua ${minutes} phút. Chưa có sự kiện mới.`);
}

function triggerLabel(trigger) {
  if (trigger === "START") return "Mở case";
  if (trigger.endsWith("-TIMEOUT")) return "Hết giờ chờ trả lời";
  if (trigger.endsWith("-DEADLINE")) return "Quá hạn xử lý";
  return run.events.find((e) => e.event_id === trigger)?.label || trigger;
}

function pipelineHtml(d) {
  const ran = (name) => d.skills_run.includes(name);
  const rejected = d.validation_issues.some((v) => !v.startsWith("confidence_capped"));
  let stopAt = null;
  if (d.status !== "ALLOWED") {
    if (!ran("build-evidence")) stopAt = "load-case";
    else if (!ran("validate-output")) stopAt = "assess-case";
    else if (rejected) stopAt = "validate-output";
    else stopAt = "policy-gate";
  }
  return run.pipeline.map((name, i) => {
    let cls = !ran(name) ? "skipped" : name === "assess-case" ? "ai" : "";
    if (name === stopAt) cls = "gate-stop";
    return `<div class="step ${cls}"><b>${i + 1}</b>${STEPS[name]}</div>`;
  }).join("");
}

function meter(level) {
  const n = { LOW: 1, MEDIUM: 2, HIGH: 3 }[level] || 0;
  return `<span class="meter">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>${level || "—"}`;
}

function render() {
  const d = run.history[selected];
  const lines = d.message_vi.split("\n");
  const reasons = lines.filter((l) => l.startsWith("- ")).map((l) => l.slice(2));
  const f = run.facts;
  const latest = selected === run.history.length - 1;
  const capped = d.validation_issues.filter((v) => v.startsWith("confidence_capped"));

  $("mode").textContent = run.mode === "REPLAY" ? "REPLAY · output AI đã lưu" : "LIVE_AI";

  $("main").innerHTML = `
    <section class="panel">
      <div class="case-head">
        <h3>${esc(run.title)} <span class="muted" style="font-size:13px;font-weight:400">${run.case_id}</span></h3>
        <span>Giờ ảo: <span class="clock">${when(run.now)}</span></span>
      </div>
      <div class="facts">
        <span class="tag">${esc(FAIL[f.failure_status] || f.failure_status)}</span>
        <span class="tag">Lượt giao: ${f.attempts_used}</span>
        <span class="tag">${esc(f.payment)}</span>
        <span class="tag">${esc(f.service_area)}</span>
        <span class="tag">Hoàn hàng: ${f.return_state === "NONE" ? "chưa" : esc(f.return_state)}</span>
        <span class="tag">Hạn: ${when(f.deadline)}</span>
        <span class="tag">Câu hỏi đã dùng: ${run.question.asked}/1${run.question.deadline && !run.question.replied ? " · chờ tới " + hhmm(run.question.deadline) : ""}</span>
      </div>
    </section>

    <section class="panel">
      <h2>Mô phỏng đầu vào</h2>
      <div class="btn-row">
        ${run.events.map((e) => `<button data-event="${e.event_id}" ${e.applied ? "disabled" : ""}>${e.applied ? "✓ " : "▶ "}${esc(e.label)}</button>`).join("")
          || '<span class="muted">Case này không có sự kiện soạn sẵn. Thử tua thời gian.</span>'}
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button data-adv="30">⏩ +30 phút</button>
        <button data-adv="150">⏩ +2 giờ 30</button>
        <button data-adv="1440">⏩ +1 ngày</button>
        <button id="reset" class="btn-primary">↺ Chạy lại case</button>
      </div>
    </section>

    <section class="panel">
      <h2>Pipeline của agent ${latest ? "" : "(đang xem quyết định cũ)"}</h2>
      <div class="pipeline">${pipelineHtml(d)}</div>
      <div class="legend"><span>🟩 đã chạy</span><span>🟨 bước AI</span><span>🟥 dừng / chuyển người xử lý</span><span>⬜ bỏ qua</span></div>
    </section>

    <section class="panel decision ${d.status}">
      <span class="badge ${d.status}">${STATUS[d.status] || d.status}</span>
      <span class="muted" style="margin-left:8px">${when(d.decided_at)} · ${esc(triggerLabel(d.trigger))}</span>
      <div class="headline">${esc(lines[0])}</div>
      <dl class="kv">
        <dt>Nguyên nhân</dt><dd>${esc(CAUSES[d.cause] || "— (không gọi AI)")}</dd>
        <dt>Mức chắc chắn</dt><dd>${meter(d.confidence)}</dd>
        <dt>Người xử lý tiếp</dt><dd>${OWNER[d.next_owner] || d.next_owner}</dd>
        ${d.reassess_at ? `<dt>Đánh giá lại lúc</dt><dd>${when(d.reassess_at)}</dd>` : ""}
      </dl>
      ${d.question_text ? `<div class="question">💬 Câu hỏi gửi người mua (giả lập):<br><b>"${esc(d.question_text)}"</b></div>` : ""}
      ${reasons.length ? `<ul class="reasons">${reasons.map((r) => `<li class="${r.includes("luôn bị chặn") ? "blocked" : ""}">${r.includes("luôn bị chặn") ? "⛔ " : ""}${esc(r)}</li>`).join("")}</ul>` : ""}
      ${capped.map((c) => `<div class="issue">Code đã hạ mức chắc chắn AI tự nhận (${esc(c.split(":")[1])}): bằng chứng chưa đủ.</div>`).join("")}
    </section>`;

  $("side").innerHTML = `
    <section class="panel">
      <h2>Bằng chứng tại thời điểm này</h2>
      ${run.evidence.map((e) => `
        <div class="ev ${d.evidence_ids.includes(e.id) ? "cited" : ""}">
          <div class="meta"><span>${esc(e.type)}</span><span>· ${esc(e.source)}</span><span>· ${hhmm(e.observed_at)}</span>
            ${e.id.startsWith("EV-C") || e.id.includes("TIMEOUT") ? '<span class="new">· mới</span>' : ""}</div>
          <div>${esc(e.text)}</div>
        </div>`).join("")}
      <p class="muted" style="font-size:12px;margin:4px 0 0">Viền xanh = bằng chứng AI dẫn ra cho quyết định đang xem.</p>
    </section>
    <section class="panel">
      <h2>Lịch sử quyết định</h2>
      ${run.history.map((h, i) => `
        <button class="hist ${i === selected ? "active" : ""}" data-hist="${i}">
          <span class="dot ${h.status}"></span><span class="t">${hhmm(h.decided_at)}</span>
          <span class="what">${esc(triggerLabel(h.trigger))}<br><b>${esc(h.action)}</b></span>
        </button>`).join("")}
      <p class="muted" style="font-size:12px;margin:4px 0 0">Mỗi sự kiện tạo một quyết định mới. Quyết định cũ được giữ lại.</p>
    </section>`;

  document.querySelectorAll("[data-event]").forEach((b) => b.onclick = () => applyEvent(b.dataset.event));
  document.querySelectorAll("[data-adv]").forEach((b) => b.onclick = () => advance(+b.dataset.adv));
  document.querySelectorAll("[data-hist]").forEach((b) => b.onclick = () => { selected = +b.dataset.hist; render(); });
  $("reset").onclick = () => startCase(run.case_id);
}

// Deep link for rehearsal: /?case=CASE-03&apply=C03-E03  or  /?case=CASE-02&advance=150
const params = new URLSearchParams(location.search);
(async () => {
  if (!params.get("case")) return loadCases();
  await startCase(params.get("case"));
  for (const id of (params.get("apply") || "").split(",").filter(Boolean)) await applyEvent(id);
  if (params.get("advance")) await advance(+params.get("advance"));
})();
</script>
</body>
</html>
