<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Order Rescue · Synthetic demo</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f5f7fb;color:#182033}section{background:white;padding:1rem;margin:1rem 0;border-radius:12px}button,select,textarea{font:inherit;padding:.6rem;margin:.3rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5f7;padding:.8rem;border-radius:8px}.warn{color:#9b4c00}</style><h1>Order Rescue</h1><p class="warn">Synthetic development data · simulated message only · policy profile incomplete</p><section><label>Case <select id="cases"></select></label><button id="start">Run initial assessment</button><button id="refresh">Refresh / resume</button></section><div id="out"></div><script>
let run;const el=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(url,body){let r=await fetch(url,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j}async function init(){let cs=await req('/api/cases');el('cases').innerHTML=cs.map(c=>`<option value="${esc(c.case_id)}">${esc(c.case_id)} · ${esc(c.title)} (synthetic)</option>`).join('')}function panel(title,obj){return `<section><h2>${title}</h2><pre>${esc(JSON.stringify(obj,null,2))}</pre></section>`}function draw(){if(!run)return;let q=run.question&&JSON.parse(run.question);el('out').innerHTML=panel('Raw input snapshot',run.input)+panel('Initial assessment',run.initial)+panel('Initial policy',run.initial_policy)+(q?panel('Simulated question',q):'')+(run.state==='WAITING_FOR_BUYER'?`<section><h2>Buyer response (free text)</h2><textarea id="reply" rows="3" style="width:95%"></textarea><br><button id="send">Submit reply</button><button id="noreply">USER_NO_REPLY demo control</button></section>`:'')+(run.after_reply?panel('After reply',run.after_reply)+panel('After reply policy',run.after_policy):'')+(run.final?panel(`Final (source ${run.source})`,run.final)+panel('Final policy',run.final_policy):'')+panel('Execution metadata / history', {meta:run.meta,events:run.events});if(q&&run.state==='WAITING_FOR_BUYER'){el('send').onclick=async()=>{try{run=await req(`/api/runs/${run.id}/replies`,{question_id:q.question_id,text:el('reply').value});draw()}catch(e){alert(e)}};el('noreply').onclick=async()=>{try{run=await req(`/api/runs/${run.id}/no-reply`,{question_id:q.question_id});draw()}catch(e){alert(e)}}}}el('start').onclick=async()=>{try{run=await req('/api/runs',{case_id:el('cases').value});localStorage.setItem('rescueRunId',run.id);draw()}catch(e){alert(e)}};el('refresh').onclick=async()=>{if(run)try{run=await req(`/api/runs/${run.id}`);draw()}catch(e){alert(e)}};init().then(async()=>{const id=localStorage.getItem('rescueRunId');if(id){try{run=await req(`/api/runs/${id}`);draw()}catch{localStorage.removeItem('rescueRunId')}}}).catch(e=>alert(e));</script>
