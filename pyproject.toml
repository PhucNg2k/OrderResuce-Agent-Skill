[project]
name = "order-rescue-prototype"
version = "0.1.0"
description = "Order Rescue AI stack prototype: skill-based pipeline, synthetic data, demo policy"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
live = ["openai>=1.66"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
